<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RecallDesk — Support that remembers</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #11151d; --panel2: #151a24; --border: #232a38;
    --text: #e8ecf3; --muted: #8b94a7; --accent: #6e8bff; --accent2: #9d7bff;
    --green: #3fb97f; --red: #e5606e; --amber: #e0a23e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
  header { padding: 14px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 14px; background: linear-gradient(180deg, #10141c, #0b0e14); }
  .logo { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; color: #fff; }
  header h1 { font-size: 19px; font-weight: 800; letter-spacing: -.3px; }
  header h1 span { background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  header .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  #bank-chip { margin-left: auto; font-size: 12px; color: var(--muted); background: var(--panel2); border: 1px solid var(--border); padding: 7px 12px; border-radius: 20px; }
  #bank-chip b { color: var(--accent); }
  #main { flex: 1; display: flex; min-height: 0; }
  /* left: customers */
  #side { width: 250px; border-right: 1px solid var(--border); padding: 16px 12px; display: flex; flex-direction: column; gap: 8px; background: var(--panel); }
  #side h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); padding: 0 8px 6px; }
  .cust { padding: 10px 12px; border-radius: 12px; border: 1px solid transparent; background: transparent; color: var(--text); cursor: pointer; text-align: left; font-size: 14px; }
  .cust .nm { font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .cust .em { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .cust .plan { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 8px; margin-left: auto; }
  .plan.Scale { background: #1d2b4d; color: #7ba2ff; }
  .plan.Pro { background: #2b2140; color: #b79bff; }
  .plan.Enterprise { background: #1e3a2c; color: #5fd39a; }
  .cust:hover { background: var(--panel2); }
  .cust.active { background: var(--panel2); border-color: var(--accent); }
  .avatar { width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; flex-shrink: 0; }
  /* center: chat */
  #chat-col { flex: 1.5; display: flex; flex-direction: column; min-width: 0; }
  #toolbar { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--border); font-size: 13px; background: var(--panel); }
  .toggle-wrap { display: flex; align-items: center; gap: 9px; font-weight: 700; }
  .toggle { width: 54px; height: 29px; border-radius: 15px; background: #2a3140; position: relative; cursor: pointer; transition: background .25s; border: none; }
  .toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 23px; height: 23px; border-radius: 50%; background: #8b94a7; transition: all .25s; }
  .toggle.on { background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .toggle.on::after { left: 28px; background: #fff; }
  #mem-status { font-size: 11px; font-weight: 800; letter-spacing: .6px; padding: 5px 12px; border-radius: 12px; }
  #mem-status.on { background: rgba(63,185,127,.14); color: var(--green); border: 1px solid rgba(63,185,127,.35); }
  #mem-status.off { background: rgba(229,96,110,.12); color: var(--red); border: 1px solid rgba(229,96,110,.35); }
  .btn { padding: 7px 14px; border-radius: 9px; border: 1px solid var(--border); background: var(--panel2); color: var(--text); cursor: pointer; font-size: 12px; font-weight: 600; }
  .btn:hover { border-color: var(--accent); }
  #prompts { display: flex; gap: 8px; padding: 10px 20px; border-bottom: 1px solid var(--border); overflow-x: auto; background: var(--panel); }
  #prompts span { font-size: 11px; color: var(--muted); align-self: center; white-space: nowrap; }
  .prompt-chip { white-space: nowrap; font-size: 12px; padding: 6px 12px; border-radius: 16px; border: 1px dashed #3a4358; background: transparent; color: #b9c2d6; cursor: pointer; }
  .prompt-chip:hover { border-color: var(--accent); color: var(--text); border-style: solid; }
  #messages { flex: 1; overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 78%; padding: 12px 16px; border-radius: 14px; font-size: 14px; line-height: 1.55; white-space: pre-wrap; animation: fadein .25s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } }
  .msg.user { align-self: flex-end; background: linear-gradient(135deg, #4a63d8, #6e4fd0); color: #fff; border-bottom-right-radius: 5px; }
  .msg.agent { align-self: flex-start; background: var(--panel2); border: 1px solid var(--border); border-bottom-left-radius: 5px; }
  .msg .tag { font-size: 10px; font-weight: 800; letter-spacing: .8px; display: block; margin-bottom: 5px; opacity: .65; }
  .typing-dots { display: inline-flex; gap: 5px; padding: 4px 0; }
  .typing-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .typing-dots i:nth-child(2) { animation-delay: .2s; } .typing-dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,60%,100% { opacity: .25; } 30% { opacity: 1; } }
  #input-row { display: flex; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--border); background: var(--panel); }
  #input { flex: 1; padding: 13px 16px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 14px; outline: none; }
  #input:focus { border-color: var(--accent); }
  #send { padding: 13px 26px; border-radius: 12px; border: none; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; font-weight: 700; cursor: pointer; font-size: 14px; }
  #send:hover { filter: brightness(1.1); }
  /* right: memory inspector */
  #mem-col { flex: 1; border-left: 1px solid var(--border); display: flex; flex-direction: column; min-width: 0; background: var(--panel); }
  #mem-col h2 { font-size: 12px; padding: 16px 18px 6px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  #mem-query { font-size: 11px; color: var(--muted); padding: 0 18px 10px; font-style: italic; }
  #mem-list { flex: 1; overflow-y: auto; padding: 0 18px 18px; display: flex; flex-direction: column; gap: 9px; }
  .mem { font-size: 12.5px; padding: 10px 12px; border-radius: 10px; background: var(--panel2); border: 1px solid var(--border); border-left: 3px solid var(--accent); line-height: 1.5; animation: fadein .25s ease; }
  .mem .type { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .6px; }
  .mem.t-world { border-left-color: var(--accent); } .mem.t-world .type { color: var(--accent); }
  .mem.t-observation { border-left-color: var(--green); } .mem.t-observation .type { color: var(--green); }
  .mem.t-experience { border-left-color: var(--amber); } .mem.t-experience .type { color: var(--amber); }
  .mem.empty { color: var(--muted); font-style: italic; border-left-color: var(--border); }
</style>
</head>
<body>
<header>
  <div class="logo">R</div>
  <div>
    <h1>Recall<span>Desk</span></h1>
    <div class="sub">Customer support agent with persistent memory · powered by Hindsight</div>
  </div>
  <div id="bank-chip">memory bank · <b id="bank-count">–</b> facts</div>
</header>

<div id="main">
  <div id="side">
    <h3>Customers</h3>
    <div id="customers" style="display:flex;flex-direction:column;gap:6px"></div>
    <div style="margin-top:auto;display:flex;flex-direction:column;gap:8px">
      <button class="btn" id="seed-btn">Seed demo data</button>
      <button class="btn" id="reset-btn">Reset chat</button>
    </div>
  </div>

  <div id="chat-col">
    <div id="toolbar">
      <div class="toggle-wrap">
        <button class="toggle on" id="mem-toggle" aria-label="toggle memory"></button>
        <span>Agent memory</span>
      </div>
      <span id="mem-status" class="on">MEMORY ON</span>
    </div>
    <div id="prompts">
      <span>Try:</span>
    </div>
    <div id="messages"></div>
    <div id="input-row">
      <input id="input" placeholder="Type as the customer…" autocomplete="off">
      <button id="send">Send</button>
    </div>
  </div>

  <div id="mem-col">
    <h2>Recalled for this reply</h2>
    <div id="mem-query"></div>
    <div id="mem-list"><div class="mem empty">Memories the agent pulled from Hindsight before replying will appear here.</div></div>
  </div>
</div>

<script>
let customerId = 'priya';
let memoryOn = true;
const AVATAR_COLORS = ['#4a63d8','#8a4fd0','#3f9e6e','#c07a3a','#c04a5e'];
const DEMO_PROMPTS = [
  'my dashboard is slow again',
  'we upgraded to Enterprise last week',
  "what's my current plan?",
  'is SSO still working for my team?'
];

async function api(path, opts={}) {
  const r = await fetch(path, opts);
  return r.json();
}

function avatarColor(name){ let h=0; for(const c of name) h+=c.charCodeAt(0); return AVATAR_COLORS[h%AVATAR_COLORS.length]; }

async function loadCustomers() {
  const cs = await api('/api/customers');
  const box = document.getElementById('customers');
  box.innerHTML = '';
  cs.forEach(c => {
    const b = document.createElement('button');
    b.className = 'cust' + (c.id === customerId ? ' active' : '');
    b.innerHTML = `<div class="nm"><span class="avatar" style="background:${avatarColor(c.name)}">${c.name[0]}</span>${c.name}<span class="plan ${c.plan}">${c.plan}</span></div><div class="em">${c.email}</div>`;
    b.onclick = () => { customerId = c.id; loadCustomers(); refreshStats(); addAgentMsg(`Hi ${c.name.split(' ')[0]}, you're now chatting as ${c.name} (${c.plan} plan).`); renderMemories([], ''); };
    box.appendChild(b);
  });
  refreshStats();
}

async function refreshStats() {
  try {
    const s = await api('/api/stats/' + customerId);
    document.getElementById('bank-count').textContent = s.total ?? '–';
  } catch(e) { document.getElementById('bank-count').textContent = '–'; }
}

function addMsg(cls, tag, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  const t = document.createElement('span'); t.className = 'tag'; t.textContent = tag;
  d.appendChild(t);
  d.appendChild(document.createTextNode(text));
  const box = document.getElementById('messages');
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}
function addAgentMsg(t){ addMsg('agent','RECALLDESK',t); }

function renderMemories(mems, query) {
  const box = document.getElementById('mem-list');
  document.getElementById('mem-query').textContent = query ? `recall query: "${query}"` : '';
  if (!mems || !mems.length) {
    box.innerHTML = '<div class="mem empty">No memories recalled — the agent answered generically.</div>';
    return;
  }
  box.innerHTML = '';
  mems.forEach(m => {
    const d = document.createElement('div');
    d.className = 'mem t-' + (m.type || 'world');
    const ty = document.createElement('div'); ty.className = 'type'; ty.textContent = m.type || 'memory';
    d.appendChild(ty);
    d.appendChild(document.createTextNode(m.text));
    box.appendChild(d);
  });
}

async function send(textOverride) {
  const inp = document.getElementById('input');
  const text = (textOverride || inp.value).trim();
  if (!text) return;
  inp.value = '';
  addMsg('user','YOU (CUSTOMER)',text);
  const typing = document.createElement('div');
  typing.className = 'msg agent';
  typing.innerHTML = '<span class="tag">RECALLDESK</span><span class="typing-dots"><i></i><i></i><i></i></span>';
  const box = document.getElementById('messages');
  box.appendChild(typing); box.scrollTop = box.scrollHeight;
  try {
    const res = await api('/api/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({customer_id: customerId, message: text, memory_on: memoryOn})
    });
    typing.remove();
    if (res.error) { addAgentMsg('Error: ' + res.error); return; }
    addAgentMsg(res.reply);
    renderMemories(res.memories_used, memoryOn ? text : '');
  } catch(e) {
    typing.remove();
    addAgentMsg('Error talking to the server. Is the backend running?');
  }
}

document.getElementById('send').onclick = () => send();
document.getElementById('input').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

// one-click demo prompts
const pbox = document.getElementById('prompts');
DEMO_PROMPTS.forEach(p => {
  const b = document.createElement('button');
  b.className = 'prompt-chip'; b.textContent = p;
  b.onclick = () => send(p);
  pbox.appendChild(b);
});

document.getElementById('mem-toggle').onclick = function() {
  memoryOn = !memoryOn;
  this.classList.toggle('on', memoryOn);
  const s = document.getElementById('mem-status');
  s.textContent = memoryOn ? 'MEMORY ON' : 'MEMORY OFF';
  s.className = memoryOn ? 'on' : 'off';
  renderMemories([], '');
};

document.getElementById('seed-btn').onclick = async () => {
  addAgentMsg('Seeding ticket history into Hindsight… (takes ~1 min)');
  const r = await api('/api/seed', {method:'POST'});
  addAgentMsg(`Seeded ${r.seeded_tickets} tickets. The agent now remembers every customer.`);
  refreshStats();
};

document.getElementById('reset-btn').onclick = async () => {
  await api('/api/reset', {method:'POST'});
  document.getElementById('messages').innerHTML = '';
  renderMemories([], '');
  addAgentMsg('Chat cleared. Hindsight memory is kept — the agent still remembers.');
};

loadCustomers();
addAgentMsg("Hi! I'm RecallDesk. Pick a customer on the left, then chat as them. Toggle memory off and on to feel the difference — or tap a suggested prompt above.");
</script>
</body>
</html>
